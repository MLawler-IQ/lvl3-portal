          - generic [ref=f7e32]: Care by condition
          - heading "COPD home care in Salem, OR" [level=1] [ref=f7e33]
          - paragraph [ref=f7e34]: With COPD, everything has a breath budget. A shower, the stairs, dinner. Your dad isn't being stubborn when he skips things, he's rationing air. We help him spend it on what matters.
          - generic [ref=f7e35]:
            - link "Talk to a care specialist" [ref=f7e36] [cursor=pointer]:
              - /url: /contact/
            - button "Take the 2-min assessment" [ref=f7e37] [cursor=pointer]
