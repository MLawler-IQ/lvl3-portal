      - generic [ref=f7e49]:
        - generic [ref=f7e50]: What it is
        - heading "What COPD home care covers." [level=2] [ref=f7e51]
        - paragraph [ref=f7e52]: "COPD home care is non-medical support built around one scarce resource: breath. We take over the tasks that burn it, pace the ones that can't be skipped, and keep the home itself from making breathing harder. Medical management stays with the pulmonologist and respiratory team."
        - generic [ref=f7e54]:
          - generic [ref=f7e55]:
            - heading "It covers" [level=4] [ref=f7e56]
            - list [ref=f7e57]:
              - listitem [ref=f7e58]: Energy-paced help with bathing, dressing, and daily tasks
              - listitem [ref=f7e59]: Housekeeping that keeps dust and scent triggers down
              - listitem [ref=f7e60]: Light meals, cooking, and cleanup
              - listitem [ref=f7e61]: Errands, groceries, and rides to appointments
              - listitem [ref=f7e62]: Safety awareness around oxygen equipment and tubing
          - generic [ref=f7e63]:
            - heading "It does not cover" [level=4] [ref=f7e64]
            - list [ref=f7e65]:
              - listitem [ref=f7e66]: Managing or adjusting oxygen
              - listitem [ref=f7e67]: Administering inhalers or nebulizer treatments
              - listitem [ref=f7e68]: Respiratory therapy
              - listitem [ref=f7e69]: Medical monitoring or assessment
      - generic [ref=f7e71]:
        - generic [ref=f7e72]:
          - generic [ref=f7e73]: How needs change
          - heading "Care matched to the breath of the day." [level=2] [ref=f7e74]
          - paragraph [ref=f7e75]: COPD tends to move in one direction, but not on a schedule. We match the help to the breath your parent actually has, week by week.
        - generic [ref=f7e76]:
          - generic [ref=f7e77]:
            - generic [ref=f7e78]: "01"
            - heading "The pacing years" [level=4] [ref=f7e79]
            - paragraph [ref=f7e80]: Mostly independent, but the expensive tasks (vacuuming, laundry baskets, grocery hauls) cost a day's energy. We take those, so the good hours go to living.
          - generic [ref=f7e81]:
            - generic [ref=f7e82]: "02"
            - heading "When the home gets smaller" [level=4] [ref=f7e83]
            - paragraph [ref=f7e84]: The activity radius shrinks toward the favorite chair. Bathing support, meals, and steady company matter more. We keep the world from shrinking with it.
          - generic [ref=f7e85]:
            - generic [ref=f7e86]: "03"
            - heading "Advanced COPD" [level=4] [ref=f7e87]
            - paragraph [ref=f7e88]: "Presence becomes the service: unhurried personal care, calm nights, and coordination alongside the medical team, including hospice when families choose it."
      - generic [ref=f7e90]:
        - generic [ref=f7e91]:
          - generic [ref=f7e92]: How we help
          - heading "Six ways we help your parent spend breath on living." [level=2] [ref=f7e93]
        - generic [ref=f7e94]:
          - generic [ref=f7e95]:
            - generic [ref=f7e96]: 
            - heading "Pacing, not pushing" [level=3] [ref=f7e97]
            - paragraph [ref=f7e98]: Every task broken into pieces with rest built in. A caregiver who understands that stopping halfway up the hall isn't quitting, it's the technique.
          - generic [ref=f7e99]:
            - generic [ref=f7e100]: 
            - heading "Bathing without the battle" [level=3] [ref=f7e101]
            - paragraph [ref=f7e102]: The most breath-expensive task of the day, done seated, slowly, with rest stops and zero rush. Many clients stop dreading it.
          - generic [ref=f7e103]:
            - generic [ref=f7e104]: 
            - heading "Trigger-aware housekeeping" [level=3] [ref=f7e105]
            - paragraph [ref=f7e106]: Dust, aerosols, and strong scents make hard breathing harder. We clean with unscented products and keep the air in mind, not just the surfaces.
          - generic [ref=f7e107]:
            - generic [ref=f7e108]: 
            - heading "Lighter meals, more often" [level=3] [ref=f7e109]
            - paragraph [ref=f7e110]: "Big meals are exhausting to eat. We cook the way many COPD families prefer: smaller, lighter, more frequent, and still worth sitting down for."
          - generic [ref=f7e111]:
            - generic [ref=f7e112]: 
            - heading "Oxygen-equipment awareness" [level=3] [ref=f7e113]
            - paragraph [ref=f7e114]: We never adjust oxygen. We do keep tubing untangled and out of walkways, watch the supply, and flag anything that looks off to you and the supplier.
          - generic [ref=f7e115]:
            - generic [ref=f7e116]: 
            - heading "Calmer nights" [level=3] [ref=f7e117]
            - paragraph [ref=f7e118]: Breathlessness anxiety peaks at 2am. An overnight presence turns bad nights survivable, for your parent and for whoever's been sleeping with one ear open.
      - generic [ref=f7e121]:
        - generic [ref=f7e122]: From a family
        - paragraph [ref=f7e123]: "\"Dad wouldn't shower for weeks because it wiped him out. His caregiver worked out a seated routine with rest breaks, and now it's just a normal Tuesday thing. A small victory to anyone else. Huge for us.\""
        - generic [ref=f7e126]:
          - generic [ref=f7e127]: Son of client
          - generic [ref=f7e128]: Stayton, OR · COPD support since 2024
