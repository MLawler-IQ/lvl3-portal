      - generic [ref=f2e49]:
        - generic [ref=f2e50]: What it is
        - heading "What dementia home care covers." [level=2] [ref=f2e51]
        - paragraph [ref=f2e52]: Dementia home care is non-medical, in-home care delivered by trained caregivers, focused on the daily tasks, communication, safety, and presence that memory loss makes difficult. It runs alongside (not instead of) the medical care your parent gets from their doctor or memory clinic.
        - generic [ref=f2e54]:
          - generic [ref=f2e55]:
            - heading "It covers" [level=4] [ref=f2e56]
            - list [ref=f2e57]:
              - listitem [ref=f2e58]: "Daily care: bathing, dressing, meals, mobility"
              - listitem [ref=f2e59]: Communication and de-escalation
              - listitem [ref=f2e60]: Home safety and fall prevention
              - listitem [ref=f2e61]: Companionship and routine anchoring
              - listitem [ref=f2e62]: Family education and respite
          - generic [ref=f2e63]:
            - heading "It does not cover" [level=4] [ref=f2e64]
            - list [ref=f2e65]:
              - listitem [ref=f2e66]: Nursing or medication administration
              - listitem [ref=f2e67]: Diagnostic or medical procedures
              - listitem [ref=f2e68]: Physical or occupational therapy
              - listitem [ref=f2e69]: Insurance billing for medical services
      - generic [ref=f2e71]:
        - generic [ref=f2e72]:
          - generic [ref=f2e73]: Stages we support
          - heading "Care that scales with the disease." [level=2] [ref=f2e74]
          - paragraph [ref=f2e75]: Dementia isn't one thing. The care your parent needs at six months is different from the care they need at three years. We staff and train for every stage.
        - generic [ref=f2e76]:
          - generic [ref=f2e77]:
            - generic [ref=f2e78]: "01"
            - heading "Early stage" [level=4] [ref=f2e79]
            - paragraph [ref=f2e80]: Mild forgetfulness, occasional confusion. The right care here is light-touch. Companionship, routine anchoring, and a watchful eye for changes.
          - generic [ref=f2e81]:
            - generic [ref=f2e82]: "02"
            - heading "Middle stage" [level=4] [ref=f2e83]
            - paragraph [ref=f2e84]: More noticeable memory loss, communication difficulty, behavior changes. Visit length increases. Same-caregiver consistency becomes critical.
          - generic [ref=f2e85]:
            - generic [ref=f2e86]: "03"
            - heading "Late stage" [level=4] [ref=f2e87]
            - paragraph [ref=f2e88]: Significant cognitive and physical decline. Full personal care, mobility support, often around-the-clock presence. We coordinate with hospice when families choose it.
      - generic [ref=f2e90]:
        - generic [ref=f2e91]:
          - generic [ref=f2e92]: How we help
          - heading "Six things that change when a caregiver is trained for this." [level=2] [ref=f2e93]
        - generic [ref=f2e94]:
          - generic [ref=f2e95]:
            - generic [ref=f2e96]: 
            - heading "Same caregiver, every visit" [level=3] [ref=f2e97]
            - paragraph [ref=f2e98]: Memory care depends on familiarity. A new face every shift is the worst version of this service.
          - generic [ref=f2e99]:
            - generic [ref=f2e100]: 
            - heading "Communication training" [level=3] [ref=f2e101]
            - paragraph [ref=f2e102]: Caregivers trained in plain-language redirection, validation, and de-escalation. Behavior is communication.
          - generic [ref=f2e103]:
            - generic [ref=f2e104]: 
            - heading "Home safety walk-through" [level=3] [ref=f2e105]
            - paragraph [ref=f2e106]: Lighting, rugs, locks, kitchen, bathroom. We map fall-risk and wandering-risk before the first visit.
          - generic [ref=f2e107]:
            - generic [ref=f2e108]: 
            - heading "Family education sessions" [level=3] [ref=f2e109]
            - paragraph [ref=f2e110]: What to expect at each stage, what to plan for, when to call us, when to call someone else.
          - generic [ref=f2e111]:
            - generic [ref=f2e112]: 
            - heading "Wandering & exit-seeking protocols" [level=3] [ref=f2e113]
            - paragraph [ref=f2e114]: Door checks, ID, GPS-watch coordination, and neighborhood-aware caregivers who know your parent's typical paths.
          - generic [ref=f2e115]:
            - generic [ref=f2e116]: 
            - heading "Quarterly care-plan reviews" [level=3] [ref=f2e117]
            - paragraph [ref=f2e118]: Memory care is a moving target. We re-plan every quarter, or sooner if something changes.
      - generic [ref=f2e121]:
