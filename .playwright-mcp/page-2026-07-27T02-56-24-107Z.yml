          - generic [ref=f8e27]: Careers
        - generic [ref=f8e28]: Careers at Pasha Health
        - heading "Do the kind of caregiving you got into this work for." [level=1] [ref=f8e29]
        - paragraph [ref=f8e30]: One consistent client instead of a rotating roster. Dementia-care training we provide. A small Salem-area agency where the scheduler knows your name and the founder knows your clients.
        - generic [ref=f8e31]:
          - link "Apply in 5 minutes" [ref=f8e32] [cursor=pointer]:
            - /url: https://pashahealth.clearcareonline.com/quick-apply/
          - link "Call 971-369-4522" [ref=f8e33] [cursor=pointer]:
            - /url: tel:971-369-4522
      - generic [ref=f8e35]:
        - generic [ref=f8e36]:
          - generic [ref=f8e37]: Why caregivers stay
          - heading "What it's like to work here." [level=2] [ref=f8e38]
          - paragraph [ref=f8e39]: "Most agencies treat caregivers the way they treat clients: as interchangeable. We don't. Consistency is our whole product, and that starts with how we treat you."
        - generic [ref=f8e40]:
          - generic [ref=f8e41]:
            - generic [ref=f8e42]: 
            - heading "Same client, every visit" [level=3] [ref=f8e43]
            - paragraph [ref=f8e44]: We schedule for consistency, not coverage. You learn one person's routines, build real trust, and see the difference you make week after week.
          - generic [ref=f8e45]:
            - generic [ref=f8e46]: 
            - heading "Training we provide" [level=3] [ref=f8e47]
            - paragraph [ref=f8e48]: Dementia-specific training before your first memory-care client, and registered nurses on the team when a situation needs a second opinion.
          - generic [ref=f8e49]:
            - generic [ref=f8e50]: 
            - heading "Your languages are an asset" [level=3] [ref=f8e51]
            - paragraph [ref=f8e52]: Our clients speak English, Russian, Serbian, Spanish, Ukrainian, Somali, and Farsi. If you grew up speaking one of them, that's a skill here, not a footnote.
          - generic [ref=f8e53]:
            - generic [ref=f8e54]: 
            - heading "Known by name" [level=3] [ref=f8e55]
            - paragraph [ref=f8e56]: A small agency, not a corporate chain. The office team answers when you call, matches you to clients you actually fit, and knows your name from day one.
      - generic [ref=f8e59]:
        - generic [ref=f8e60]: What we look for
        - heading "Hired harder, trained better." [level=2] [ref=f8e61]
        - paragraph [ref=f8e62]: "Every caregiver placed with a Pasha Health family is dementia-trained, background-checked, and matched to the client's personality and care needs. Not assigned at random. Not rotated week to week. Here's what that means for who we hire:"
        - list [ref=f8e63]:
          - listitem [ref=f8e64]: Genuine warmth that goes beyond a job description
          - listitem [ref=f8e65]: Patience for the slow moments. Dementia care rewards people who don't rush.
          - listitem [ref=f8e66]: Reliability. Families build their whole day around your visit.
          - listitem [ref=f8e67]: Experience helps, but calling matters more. We train the skills.
          - listitem [ref=f8e68]: A clean background check. Everything else, we can teach.
        - paragraph [ref=f8e69]:
          - text: Questions before you apply? Call us at
          - link "971-369-4522" [ref=f8e70] [cursor=pointer]:
            - /url: tel:971-369-4522
          - text: and ask for the office team. A real person answers.
      - generic [ref=f8e73]:
        - generic [ref=f8e74]: Ready when you are
        - heading "Five minutes to apply. A real person reads it." [level=2] [ref=f8e75]
        - paragraph [ref=f8e76]: The application runs through ClearCare, our care platform. Short and simple. We'll call you back to talk it through.
        - generic [ref=f8e77]:
          - link "Apply now" [ref=f8e78] [cursor=pointer]:
