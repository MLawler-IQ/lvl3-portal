        - generic [ref=f10e29]:
          - generic [ref=f10e30]: About Pasha Health
          - heading "A family-run home care company. For twelve years." [level=1] [ref=f10e31]
          - paragraph [ref=f10e32]: Founded by Alina Strelnikov, CMA, after more than a decade in the medical field. For twelve years we've served seniors and individuals with disabilities across the Salem area, specializing in dementia and Alzheimer's care from day one.
          - generic [ref=f10e33]:
            - link "Schedule a 15-min call" [ref=f10e34] [cursor=pointer]:
              - /url: /contact/
            - button "Take the 2-min assessment" [ref=f10e35] [cursor=pointer]
      - generic [ref=f10e40]:
        - generic [ref=f10e41]: Why we exist
        - heading "We hire people we'd hire to care for our own parents. That's the bar." [level=2] [ref=f10e42]
        - paragraph [ref=f10e43]: "Most home care companies are franchises optimized for scale. They turn caregivers over fast, schedule by shift, and treat the relationship like a transaction. That model produces a particular kind of failure: a person you've never met arriving at your mother's door at 9am, with no context for who she is."
        - paragraph [ref=f10e44]: We're not built that way. We hire fewer caregivers, pay them more, train them better, and keep them with the same client for years. The cost of that consistency is real. It's the entire product.
        - paragraph [ref=f10e45]: Every client is known by name. Every caregiver is carefully matched. Every family feels supported rather than processed. That's not a marketing promise. It's the reason we exist.
      - generic [ref=f10e51]:
        - generic [ref=f10e52]: Founder
        - heading "Alina Strelnikov, CMA." [level=2] [ref=f10e53]
        - paragraph [ref=f10e54]: "\"I knew at the age of 10 years old, I wanted to care for the elderly. My journey began 12 years ago, and since then, I have dedicated myself to serving seniors and individuals with disabilities. At the core of my philosophy is the belief that caring for others is not just a profession, but a calling that I embrace wholeheartedly.\""
        - paragraph [ref=f10e55]: "Alina came to home care with over a decade of experience in the medical field and built Pasha Health around the work she knows best: dementia and Alzheimer's care. She works closely with each client and their loved ones to create a nurturing environment where they can thrive, and she built the company to be the kind of provider she would want for her own family."
        - paragraph [ref=f10e56]: Just rest and let us take care of you.
        - generic [ref=f10e57]:
          - generic [ref=f10e58]:
            - generic [ref=f10e59]: 12 yrs
