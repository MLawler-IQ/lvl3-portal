              - paragraph [ref=f10e154]: New service pages, condition pages, and the 30-day post-hospital recovery program.
      - generic [ref=f10e158]:
        - generic [ref=f10e159]: Where we come from
        - heading "Salem, the Willamette Valley, and the languages our parents spoke." [level=2] [ref=f10e160]
        - paragraph [ref=f10e161]: The Salem area is home to one of Oregon's largest Russian, Ukrainian, and Eastern European populations, plus rapidly growing Somali and Latino communities. Many of those families have aging parents who arrived in the U.S. late in life. By the time care is needed, they often prefer to receive it in the language they grew up with.
        - paragraph [ref=f10e162]: We hire from those same communities. It's a hiring philosophy and a service philosophy at the same time.
      - generic [ref=f10e167]:
        - generic [ref=f10e168]: Start the conversation
        - heading "A 15-minute call. No commitment." [level=2] [ref=f10e169]
        - paragraph [ref=f10e170]: We'll listen, answer questions, and tell you honestly whether we're the right fit.
