      - generic [ref=f10e65]:
        - generic [ref=f10e66]:
          - generic [ref=f10e67]: Who works here
          - heading "A small team. Most of us have been here a long time." [level=2] [ref=f10e68]
          - paragraph [ref=f10e69]: The people who answer the phone, match caregivers, and coordinate the care. The caregiver roster is larger and changes slowly. That's the point.
        - generic [ref=f10e70]:
          - generic [ref=f10e74]:
            - generic [ref=f10e75]: Dusica Drazic
            - generic [ref=f10e76]: RN
            - paragraph [ref=f10e77]: Clinical experience from geriatrics to neonatal care. Looks after clients from both a medical and a social perspective.
          - generic [ref=f10e81]:
            - generic [ref=f10e82]: Alina Ponomarenko
            - generic [ref=f10e83]: Administrative Coordinator
            - paragraph [ref=f10e84]: Over 10 years in the medical field. Committed to helping clients and their loved ones experience a better, more fulfilling life.
