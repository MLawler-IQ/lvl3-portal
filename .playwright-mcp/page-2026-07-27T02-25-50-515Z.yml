        - generic [ref=f4e72]: Our specialty
        - heading "Twelve years of dementia & Alzheimer's care." [level=2] [ref=f4e73]
        - paragraph [ref=f4e74]: Dementia is the highest-stakes work we do. It's also where the brand started. Most of our first clients came through families navigating an early-stage Alzheimer's diagnosis. The way we hire, train, and schedule caregivers reflects that history.
        - list [ref=f4e75]:
          - listitem [ref=f4e76]: Caregivers trained in dementia-specific communication and de-escalation
          - listitem [ref=f4e77]: Same-caregiver consistency. The part that matters most for memory care.
          - listitem [ref=f4e78]: Fall-prevention home assessment included with every plan
          - listitem [ref=f4e79]: Family education sessions on what to expect as the disease progresses
        - generic [ref=f4e80]:
          - link "See our dementia approach" [ref=f4e81] [cursor=pointer]:
            - /url: /conditions/dementia/
