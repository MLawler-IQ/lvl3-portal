    - generic [ref=f3e242]:
      - generic [ref=f3e243]:
        - paragraph [ref=f3e244]: Methodology
        - heading "How net content is measured" [level=2] [ref=f3e245]
        - paragraph [ref=f3e246]: Net peptide content is quantified by reversed-phase HPLC with UV detection, measured against a certified reference standard of known concentration. Identity and purity are reported alongside; content is the determinative parameter.
      - generic [ref=f3e247]:
        - generic [ref=f3e248]:
          - heading "Quantification" [level=3] [ref=f3e249]
          - paragraph [ref=f3e250]: The sample is separated by reversed-phase HPLC with UV detection. The target peak area is integrated and compared against a certified reference standard of known concentration to derive net content by mass.
        - generic [ref=f3e251]:
          - heading "Identity" [level=3] [ref=f3e252]
          - paragraph [ref=f3e253]: Identity is confirmed by retention time against the reference standard and, where required, by mass. A match is a necessary condition; it is not a statement of quantity.
        - generic [ref=f3e254]:
          - heading "Purity" [level=3] [ref=f3e255]
          - paragraph [ref=f3e256]: Purity is read as the percentage of total peak area attributable to the target compound. It describes composition, not the mass present.
      - generic [ref=f3e257]:
        - generic [ref=f3e258]:
          - heading "Why content, not purity, is the reported outcome" [level=3] [ref=f3e259]
          - paragraph [ref=f3e260]: Purity is a low-variance measurement. It clears specification in the substantial majority of submitted samples. Quantitative content is where samples diverge from the label, and content is the parameter against which a dose is calculated. A sample may report high purity and still be materially short.
        - paragraph [ref=f3e262]: "Method limits: LOD [to confirm], LOQ [to confirm], recovery [to confirm], intra-assay CV [to confirm], instrument [model to confirm]. Values are established per method and stated on the certificate."
