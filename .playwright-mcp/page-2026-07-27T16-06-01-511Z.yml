          - paragraph [ref=e90]: Estimates only, using the market rate you set above. Real quotes depend on care level, schedule, and location. This is not a Pasha price.
      - generic [ref=e92]:
        - generic [ref=e93]:
          - generic [ref=e94]: Oregon benchmarks
          - heading "What care costs in Oregon, side by side." [level=2] [ref=e95]
          - paragraph [ref=e96]: Statewide medians from the 2025 CareScout Cost of Care Survey, the standard industry source. Salem-area rates typically run at or slightly below these.
        - generic [ref=e97]:
          - generic [ref=e98]:
            - generic [ref=e99]: Home care, hourly
            - generic [ref=e100]: $40/hr
          - generic [ref=e101]:
            - generic [ref=e102]: Home care, 20 hrs/week
            - generic [ref=e103]: ~$3,470/mo
          - generic [ref=e104]:
            - generic [ref=e105]: Assisted living
            - generic [ref=e106]: $6,875/mo
          - generic [ref=e107]:
            - generic [ref=e108]: Nursing home, semi-private
            - generic [ref=e109]: $16,760/mo
        - paragraph [ref=e110]: For context, the national median for home care is $35 per hour. Oregon runs higher than most states across every care setting, which makes the hours decision matter even more here.
      - generic [ref=e112]:
        - generic [ref=e113]:
          - generic [ref=e114]: Home care vs. the alternatives
          - heading "Home care wins at part-time hours. Then the math changes." [level=2] [ref=e115]
          - paragraph [ref=e116]: We would rather you hear this from us than discover it later. Here is where each option makes financial sense, using the 2025 Oregon medians.
        - generic [ref=e117]:
          - generic [ref=e118]:
            - generic [ref=e119]: "01"
            - 'heading "Under 40 hours a week: home care, clearly" [level=4] [ref=e120]'
            - paragraph [ref=e121]: Twenty hours a week at the Oregon median is about $3,470 a month, roughly half the cost of assisted living. Your parent keeps their home, their routine, and one consistent caregiver. This is where most families live, and where home care is the obvious value.
          - generic [ref=e122]:
            - generic [ref=e123]: "02"
            - 'heading "Around 40 hours: the lines cross" [level=4] [ref=e124]'
            - paragraph [ref=e125]: "Full weekday coverage runs about $6,930 a month, essentially the same as Oregon's $6,875 assisted living median. At this point the decision stops being financial. It becomes about what your parent wants: their own home and one-on-one attention, or a community setting."
          - generic [ref=e126]:
            - generic [ref=e127]: "03"
            - 'heading "Around the clock: facilities cost less" [level=4] [ref=e128]'
            - paragraph [ref=e129]: True 24/7 home care at market rates can run $25,000 to $29,000 a month, well above a nursing home's $16,760 median. Some families choose it anyway, especially near the end of life, and we understand why. But you should walk in knowing the numbers, not discover them.
      - generic [ref=e131]:
        - generic [ref=e132]:
          - generic [ref=e133]: How families pay
          - heading "Four ways to pay for home care in Oregon." [level=2] [ref=e134]
          - paragraph [ref=e135]: Most families combine two or more of these. If you are not sure where to start, the ADRC (855-673-2372) is Oregon's free front door for all of it.
        - generic [ref=e136]:
          - generic [ref=e137]:
            - generic [ref=e138]: 
            - heading "Private pay" [level=3] [ref=e139]
            - paragraph [ref=e140]: "Most families start here: savings, retirement income, family contributions, or a mix. The calculator above is your budgeting tool. Many families split a month of care across siblings the same way they would any shared family cost."
          - generic [ref=e141]:
            - generic [ref=e142]: 
            - heading "Long-term care insurance" [level=3] [ref=e143]
            - paragraph [ref=e144]: If your parent bought a long-term care policy years ago, it likely covers in-home care. Find the policy, check the daily or monthly benefit and the elimination period, and call the insurer before care starts. We are happy to help you read the fine print.
          - generic [ref=e145]:
            - generic [ref=e146]: 
            - heading "VA Aid & Attendance" [level=3] [ref=e147]
            - paragraph [ref=e148]: Wartime veterans and surviving spouses may qualify for VA Aid & Attendance, a monthly pension add-on that can be put toward in-home care. Many eligible families have never heard of it. The Oregon Department of Veterans Affairs can help you apply for free.
          - generic [ref=e149]:
            - generic [ref=e150]: 
            - heading "Medicaid and Oregon programs" [level=3] [ref=e151]
            - paragraph [ref=e152]: Oregon Medicaid covers in-home care for those who qualify, largely through the Community First Choice Option (the K Plan), run by ODHS Aging and People with Disabilities. And Oregon Project Independence helps people who earn too much for Medicaid but still need help at home. Your local Aging and Disability Resource Connection (ADRC) is the front door for both.
        - paragraph [ref=e153]: "One boundary worth knowing: Medicare does not cover ongoing non-medical home care. It covers short-term, doctor-ordered home health after a hospital stay, which is a different service that often runs alongside ours."
      - generic [ref=e156]:
        - paragraph [ref=e157]: Just rest and let us take care of you.
        - paragraph [ref=e158]: The money conversation is stressful. It is also solvable. Families figure this out every week, and you will too.
