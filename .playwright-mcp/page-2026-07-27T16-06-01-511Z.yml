      - generic [ref=e49]:
        - generic [ref=e50]: The short answer
        - heading "About $40 an hour. The rest is multiplication." [level=2] [ref=e51]
        - paragraph [ref=e52]: "The median rate for non-medical home care in Oregon is about $40 per hour, according to the 2025 CareScout Cost of Care Survey. What a month of care costs your family depends almost entirely on one variable: hours per week. A few mornings of help is a few hundred dollars a week. Around-the-clock care is a different financial conversation entirely."
        - generic [ref=e53]: No agency can honestly quote you a price before understanding the situation. Anyone who does is quoting a package, not your parent. The math below is the market. Your number comes from a conversation.
      - generic [ref=e55]:
        - generic [ref=e56]:
          - generic [ref=e57]: Do the math
          - heading "Estimate your monthly cost." [level=2] [ref=e58]
          - paragraph [ref=e59]: Pick the hours that match your parent's week, adjust the rate if you have a quote in hand, and see the weekly, monthly, and yearly picture.
        - generic [ref=e60]:
