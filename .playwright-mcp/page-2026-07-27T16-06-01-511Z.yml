        - generic [ref=e31]:
          - generic [ref=e32]: The money conversation
          - heading "What home care actually costs in Oregon." [level=1] [ref=e33]
          - paragraph [ref=e34]: You cannot plan around a mystery. Here are the real Oregon numbers, a calculator that does the math for your situation, and every way families pay for care. No games, no "call for pricing" runaround on the market facts.
